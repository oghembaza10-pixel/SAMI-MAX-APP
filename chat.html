<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMI — Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .chat-header {
      background: linear-gradient(135deg, #1a1500, #111);
      border-bottom: 2px solid #c9a227;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #c9a227, #a07d10);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .chat-header-info h2 { color: #c9a227; font-size: 18px; }
    .chat-header-info p { color: #888; font-size: 12px; }
    .online { color: #00cc66 !important; }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #0d0d0d;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

    .msg { display: flex; gap: 10px; max-width: 75%; }
    .msg.sami { align-self: flex-start; }
    .msg.client { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c9a227, #a07d10);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.client .msg-avatar { background: #222; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.sami .msg-bubble {
      background: #1a1500;
      border: 1px solid #2a2000;
      color: #e8d080;
      border-top-left-radius: 4px;
    }
    .msg.client .msg-bubble {
      background: #1a1a2e;
      border: 1px solid #222244;
      color: #ccc;
      border-top-right-radius: 4px;
    }
    .msg-time { font-size: 10px; color: #444; margin-top: 4px; text-align: right; }

    /* ── TYPING ── */
    .typing { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
    .typing span {
      width: 8px; height: 8px;
      background: #c9a227;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }

    /* ── INPUT ── */
    .chat-input {
      background: #111;
      border-top: 1px solid #1e1e1e;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .chat-input input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 12px 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input input:focus { border-color: #c9a227; }
    .chat-input input::placeholder { color: #444; }
    .send-btn {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #c9a227, #a07d10);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }

    /* ── SUGGESTIONS ── */
    .suggestions {
      display: flex;
      gap: 8px;
      padding: 0 24px 12px;
      flex-wrap: wrap;
      background: #111;
    }
    .suggestion-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #c9a227;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .suggestion-btn:hover { background: #222; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="chat-header">
  <div class="avatar">🤖</div>
  <div class="chat-header-info">
    <h2>SAMI</h2>
    <p class="online">● En ligne — Assistant intelligent</p>
  </div>
</div>

<!-- MESSAGES -->
<div class="messages" id="messages">
  <!-- Message de bienvenue -->
  <div class="msg sami">
    <div class="msg-avatar">🤖</div>
    <div>
      <div class="msg-bubble">
        Salam ! 👋 Je suis <strong>SAMI</strong>, votre assistant.<br><br>
        Je peux vous aider avec :<br>
        📦 Suivi de commande<br>
        📍 Statut de livraison<br>
        ❓ Toute autre question
      </div>
      <div class="msg-time">maintenant</div>
    </div>
  </div>
</div>

<!-- SUGGESTIONS -->
<div class="suggestions" id="suggestions">
  <button class="suggestion-btn" onclick="envoyerSuggestion('Où est ma commande ?')">📦 Où est ma commande ?</button>
  <button class="suggestion-btn" onclick="envoyerSuggestion('Comment retourner un article ?')">↩️ Retour article</button>
  <button class="suggestion-btn" onclick="envoyerSuggestion('Délai de livraison ?')">🚚 Délai livraison</button>
  <button class="suggestion-btn" onclick="envoyerSuggestion('Parler à un humain')">👤 Parler à un humain</button>
</div>

<!-- INPUT -->
<div class="chat-input">
  <input type="text" id="userInput" placeholder="Écrivez votre message..." autocomplete="off" />
  <button class="send-btn" onclick="envoyerMessage()">➤</button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");

  function getTime() {
    return new Date().toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" });
  }

  function ajouterMessage(texte, type) {
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.innerHTML = `
      <div class="msg-avatar">${type === "sami" ? "🤖" : "👤"}</div>
      <div>
        <div class="msg-bubble">${texte}</div>
        <div class="msg-time">${getTime()}</div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function afficherTyping() {
    const div = document.createElement("div");
    div.className = "msg sami";
    div.id = "typing";
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function supprimerTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function envoyerMessage() {
    const texte = inputEl.value.trim();
    if (!texte) return;

    inputEl.value = "";
    document.getElementById("suggestions").style.display = "none";
    ajouterMessage(texte, "client");
    afficherTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: texte })
      });
      const data = await res.json();
      supprimerTyping();
      ajouterMessage(data.reponse || "Je n'ai pas compris, pouvez-vous reformuler ?", "sami");
    } catch (err) {
      supprimerTyping();
      ajouterMessage("❌ Erreur de connexion. Réessayez dans un instant.", "sami");
    }
  }

  function envoyerSuggestion(texte) {
    inputEl.value = texte;
    envoyerMessage();
  }

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") envoyerMessage();
  });
</script>
</body>
</html>
