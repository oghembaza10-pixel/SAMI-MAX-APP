<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMI — Dashboard Marchand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f0d060;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
      border-bottom: 2px solid #c9a227;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 28px;
      color: #c9a227;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    header h1 span { color: #fff; }
    .status-dot {
      width: 12px; height: 12px;
      background: #00ff88;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-label { font-size: 14px; color: #aaa; }

    /* ── MAIN ── */
    main { padding: 30px 40px; }

    /* ── DATE ── */
    .date-bar {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── CARDS GRID ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .card {
      background: linear-gradient(145deg, #1c1c1c, #141414);
      border: 1px solid #2a2a2a;
      border-top: 3px solid #c9a227;
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(201,162,39,0.15);
    }
    .card .icon { font-size: 32px; margin-bottom: 10px; }
    .card .label { font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .card .value { font-size: 30px; font-weight: 700; color: #c9a227; }
    .card .sub { font-size: 12px; color: #555; margin-top: 4px; }

    .card.green { border-top-color: #00cc66; }
    .card.green .value { color: #00cc66; }
    .card.red { border-top-color: #ff4444; }
    .card.red .value { color: #ff4444; }
    .card.blue { border-top-color: #4488ff; }
    .card.blue .value { color: #4488ff; }

    /* ── SECTION TITRE ── */
    .section-title {
      font-size: 14px;
      color: #c9a227;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-left: 3px solid #c9a227;
      padding-left: 12px;
      margin-bottom: 20px;
    }

    /* ── TABLE COMMANDES ── */
    .table-wrap {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: linear-gradient(90deg, #1a1500, #1c1c1c); }
    thead th {
      padding: 14px 16px;
      text-align: left;
      font-size: 11px;
      color: #c9a227;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    tbody tr {
      border-top: 1px solid #1a1a1a;
      transition: background 0.15s;
    }
    tbody tr:hover { background: #161616; }
    tbody td { padding: 13px 16px; font-size: 14px; color: #ddd; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge.paid { background: #003322; color: #00cc66; border: 1px solid #00cc66; }
    .badge.provisoire { background: #1a1200; color: #ffaa00; border: 1px solid #ffaa00; }
    .badge.blacklist { background: #220000; color: #ff4444; border: 1px solid #ff4444; }
    .badge.vip { background: #1a1200; color: #c9a227; border: 1px solid #c9a227; }
    .badge.nouveau { background: #001a33; color: #4488ff; border: 1px solid #4488ff; }

    /* ── ANALYSE ── */
    .analyse-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }
    .analyse-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px;
    }
    .analyse-box h3 { font-size: 13px; color: #888; margin-bottom: 16px; letter-spacing: 1px; text-transform: uppercase; }
    .analyse-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 14px;
    }
    .analyse-item:last-child { border-bottom: none; }
    .analyse-item .name { color: #ccc; }
    .analyse-item .val { color: #c9a227; font-weight: 600; }

    /* ── CONSEILS ── */
    .conseils { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
    .conseil-item {
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 4px solid #c9a227;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 14px;
      color: #ccc;
    }
    .conseil-item.danger { border-left-color: #ff4444; }
    .conseil-item.success { border-left-color: #00cc66; }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 60px;
      color: #555;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #222;
      border-top-color: #c9a227;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── REFRESH BTN ── */
    .refresh-btn {
      background: linear-gradient(135deg, #c9a227, #a07d10);
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    .refresh-btn:hover { opacity: 0.85; }

    @media (max-width: 768px) {
      main { padding: 20px; }
      header { padding: 16px 20px; }
      .analyse-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>SAMI <span>Dashboard</span></h1>
  <div>
    <span class="status-dot"></span>
    <span class="status-label">Système actif</span>
  </div>
</header>

<main>
  <div class="date-bar" id="dateBar">Chargement...</div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Chargement des données...
    </div>
  </div>
</main>

<script>
  // ── DATE ──
  const now = new Date();
  document.getElementById("dateBar").textContent =
    now.toLocaleDateString("fr-DZ", { weekday: "long", year: "numeric", month: "long", day: "numeric" }).toUpperCase() +
    " — " + now.toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" });

  // ── CHARGER DONNÉES ──
  async function chargerDashboard() {
    try {
      const res = await fetch("/api/dashboard");
      const data = await res.json();
      afficherDashboard(data);
    } catch (err) {
      document.getElementById("content").innerHTML =
        `<div class="loading" style="color:#ff4444">❌ Erreur de chargement — ${err.message}</div>`;
    }
  }

  function afficherDashboard(d) {
    const tauxConf = d.total > 0 ? Math.round((d.confirmees / d.total) * 100) : 0;

    document.getElementById("content").innerHTML = `

      <!-- CARDS -->
      <div class="cards">
        <div class="card">
          <div class="icon">📦</div>
          <div class="label">Commandes</div>
          <div class="value">${d.total}</div>
          <div class="sub">aujourd'hui</div>
        </div>
        <div class="card green">
          <div class="icon">✅</div>
          <div class="label">Confirmées</div>
          <div class="value">${d.confirmees}</div>
          <div class="sub">taux ${tauxConf}%</div>
        </div>
        <div class="card">
          <div class="icon">⏳</div>
          <div class="label">Provisoires</div>
          <div class="value">${d.provisoires}</div>
          <div class="sub">en attente</div>
        </div>
        <div class="card red">
          <div class="icon">🚫</div>
          <div class="label">Blacklist</div>
          <div class="value">${d.blacklist}</div>
          <div class="sub">à vérifier</div>
        </div>
        <div class="card">
          <div class="icon">💰</div>
          <div class="label">Ventes</div>
          <div class="value">${d.totalVentes.toLocaleString()}</div>
          <div class="sub">DA confirmés</div>
        </div>
        <div class="card blue">
          <div class="icon">🛒</div>
          <div class="label">Panier moyen</div>
          <div class="value">${d.panierMoyen.toLocaleString()}</div>
          <div class="sub">DA</div>
        </div>
        <div class="card">
          <div class="icon">⭐</div>
          <div class="label">Clients VIP</div>
          <div class="value">${d.vip}</div>
          <div class="sub">aujourd'hui</div>
        </div>
        <div class="card blue">
          <div class="icon">🆕</div>
          <div class="label">Nouveaux</div>
          <div class="value">${d.nouveaux}</div>
          <div class="sub">clients</div>
        </div>
      </div>

      <!-- COMMANDES RÉCENTES -->
      <div class="section-title">📋 Commandes du jour</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Client</th>
              <th>Téléphone</th>
              <th>Total</th>
              <th>Statut</th>
              <th>Catégorie</th>
              <th>Heure</th>
            </tr>
          </thead>
          <tbody>
            ${d.commandes.length === 0
              ? `<tr><td colspan="7" style="text-align:center;color:#555;padding:30px">Aucune commande aujourd'hui</td></tr>`
              : d.commandes.map(c => `
              <tr>
                <td style="color:#c9a227;font-weight:600">#${c.id}</td>
                <td>${c.client}</td>
                <td style="color:#888">${c.telephone || "—"}</td>
                <td style="color:#fff;font-weight:600">${parseFloat(c.total || 0).toLocaleString()} DA</td>
                <td><span class="badge ${c.statut === 'paid' ? 'paid' : 'provisoire'}">${c.statut}</span></td>
                <td><span class="badge ${(c.categorie || '').toLowerCase()}">${c.categorie || "—"}</span></td>
                <td style="color:#555">${c.heure || "—"}</td>
              </tr>`).join("")
            }
          </tbody>
        </table>
      </div>

      <!-- ANALYSE -->
      <div class="section-title">📊 Analyse journalière</div>
      <div class="analyse-grid">
        <div class="analyse-box">
          <h3>Ce qui va bien 🟢</h3>
          ${d.positifs.length > 0
            ? d.positifs.map(p => `<div class="analyse-item"><span class="name">${p}</span></div>`).join("")
            : `<div class="analyse-item"><span class="name" style="color:#555">Rien à signaler</span></div>`}
        </div>
        <div class="analyse-box">
          <h3>Ce qui va pas 🔴</h3>
          ${d.negatifs.length > 0
            ? d.negatifs.map(n => `<div class="analyse-item"><span class="name">${n}</span></div>`).join("")
            : `<div class="analyse-item"><span class="name" style="color:#00cc66">Tout va bien !</span></div>`}
        </div>
      </div>

      <!-- CONSEILS -->
      <div class="section-title">💡 Conseils SAMI</div>
      <div class="conseils">
        ${d.conseils.length > 0
          ? d.conseils.map(c => `<div class="conseil-item">${c}</div>`).join("")
          : `<div class="conseil-item success">✅ Excellente journée, rien à améliorer !</div>`}
      </div>

      <div style="text-align:center;margin-top:20px">
        <button class="refresh-btn" onclick="chargerDashboard()">🔄 Actualiser</button>
      </div>
    `;
  }

  chargerDashboard();
  // Auto-refresh toutes les 5 minutes
  setInterval(chargerDashboard, 300000);
</script>
</body>
</html>
